<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0D1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ГИБДД 2026 — Тренажёр</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#0D1117;--s1:#161B22;--s2:#21262D;--bd:#30363D;--pr:#58A6FF;--ok:#3FB950;--er:#F85149;--wn:#E3B341;--tx:#E6EDF3;--mu:#8B949E;--r:12px}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;overflow:hidden}
#app{height:100%;max-width:480px;margin:0 auto;position:relative}
.scr{position:absolute;inset:0;display:none;flex-direction:column;overflow-y:auto;padding:16px;padding-top:max(16px,env(safe-area-inset-top));padding-bottom:max(24px,env(safe-area-inset-bottom))}
.scr.on{display:flex}
.htitle{text-align:center;padding:20px 0 20px}
.htitle h1{font-size:24px;font-weight:800;letter-spacing:-.5px}
.htitle p{color:var(--mu);font-size:13px;margin-top:5px}
.sec-grid{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.scard{background:var(--s1);border:2px solid var(--bd);border-radius:var(--r);padding:16px;cursor:pointer;display:flex;align-items:center;gap:12px;transition:.15s;user-select:none}
.scard.on{border-color:var(--pr);background:rgba(88,166,255,.08)}
.scard .ic{font-size:30px;flex-shrink:0}
.scard .inf h3{font-size:15px;font-weight:600}
.scard .inf p{font-size:12px;color:var(--mu);margin-top:2px}
.scard .cnt{margin-left:auto;background:var(--s2);border-radius:6px;padding:3px 9px;font-size:11px;color:var(--mu);flex-shrink:0}
.trow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tbtn{padding:9px 15px;border-radius:8px;border:1.5px solid var(--bd);background:var(--s1);color:var(--tx);cursor:pointer;font-size:13px;font-weight:500;user-select:none}
.tbtn.on{border-color:var(--pr);background:rgba(88,166,255,.1);color:var(--pr)}
.srow{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-top:1px solid var(--bd)}
.srow label{font-size:14px;color:var(--mu);cursor:pointer}
.tog{position:relative;width:46px;height:26px;flex-shrink:0}
.tog input{opacity:0;width:0;height:0;position:absolute}
.tog-sl{position:absolute;inset:0;background:var(--bd);border-radius:13px;cursor:pointer;transition:.2s}
.tog input:checked+.tog-sl{background:var(--pr)}
.tog-sl:before{content:'';position:absolute;width:20px;height:20px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.tog input:checked+.tog-sl:before{transform:translateX(20px)}
.sbtn{background:var(--pr);color:#0D1117;border:none;border-radius:var(--r);padding:16px;font-size:16px;font-weight:700;cursor:pointer;margin-top:auto;width:100%}
.sbtn:disabled{background:var(--bd);color:var(--mu);cursor:default}
.sbtn:not(:disabled):active{opacity:.85}
.qhdr{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-shrink:0}
.bbtn{background:none;border:none;color:var(--mu);font-size:22px;cursor:pointer;padding:4px 6px;line-height:1}
.pbar{flex:1;height:6px;background:var(--bd);border-radius:3px;overflow:hidden}
.pfill{height:100%;background:var(--pr);border-radius:3px;transition:width .4s}
.qcnt{font-size:13px;color:var(--mu);white-space:nowrap;min-width:36px;text-align:right}
.qcard{background:var(--s1);border-radius:var(--r);padding:18px;margin-bottom:14px;flex-shrink:0}
.qlbl{font-size:11px;color:var(--mu);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.qtxt{font-size:15px;line-height:1.65;font-weight:500}
.qimg{margin-top:10px;padding:8px 12px;background:rgba(227,179,65,.1);border-left:3px solid var(--wn);border-radius:4px;font-size:12px;color:var(--wn);display:none}
.anss{display:flex;flex-direction:column;gap:8px;margin-bottom:14px;flex-shrink:0}
.abtn{background:var(--s1);border:1.5px solid var(--bd);border-radius:var(--r);padding:14px 16px;text-align:left;color:var(--tx);font-size:14px;line-height:1.5;cursor:pointer;transition:.12s;min-height:52px;width:100%;font-family:inherit}
.abtn:not(:disabled):active{background:var(--s2)}
.abtn.ok{border-color:var(--ok)!important;background:rgba(63,185,80,.12)!important;color:var(--ok)!important}
.abtn.er{border-color:var(--er)!important;background:rgba(248,81,73,.12)!important;color:var(--er)!important}
.hwrap{margin-bottom:14px;flex-shrink:0}
.hbtn{background:none;border:1.5px solid var(--bd);border-radius:var(--r);padding:12px 16px;color:var(--mu);font-size:13px;cursor:pointer;width:100%;font-family:inherit}
.htxt{margin-top:8px;padding:12px 14px;background:rgba(88,166,255,.1);border-left:3px solid var(--pr);border-radius:4px;font-size:13px;color:var(--pr);line-height:1.6;display:none}
.nbtn{border:1.5px solid var(--bd);border-radius:var(--r);padding:15px;color:var(--tx);font-size:15px;font-weight:600;cursor:pointer;width:100%;background:var(--s1);display:none;margin-top:auto;flex-shrink:0;font-family:inherit}
.nbtn.go{border-color:var(--pr);background:var(--pr);color:#0D1117}
.rtop{display:flex;flex-direction:column;align-items:center;padding:28px 0 20px;flex-shrink:0}
.scircle{width:120px;height:120px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;border:4px solid var(--ok);margin-bottom:14px}
.scircle.wn{border-color:var(--wn)}.scircle.er{border-color:var(--er)}
.snum{font-size:34px;font-weight:800;line-height:1}
.sof{font-size:13px;color:var(--mu)}
.slbl{font-size:18px;font-weight:600}
.spct{font-size:13px;color:var(--mu);margin-top:4px}
.mtitle{font-size:12px;font-weight:600;color:var(--mu);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;flex-shrink:0}
.mitem{background:var(--s1);border-radius:10px;padding:12px 14px;margin-bottom:8px}
.mq{font-size:12px;color:var(--mu);margin-bottom:4px}
.myr{font-size:13px;color:var(--er)}
.mcr{font-size:13px;color:var(--ok);font-weight:500;margin-top:2px}
.ract{display:flex;gap:10px;margin-top:16px;flex-shrink:0}
.ract button{flex:1;padding:14px;border-radius:var(--r);font-size:14px;font-weight:600;cursor:pointer;border:1.5px solid var(--bd);background:var(--s1);color:var(--tx);font-family:inherit}
.ract .pb{background:var(--pr);border-color:var(--pr);color:#0D1117}
</style>
</head>
<body>
<div id="app">

<div id="sh" class="scr on">
  <div class="htitle">
    <h1>🚔 ГИБДД 2026</h1>
    <p>Тренажёр для подготовки к проверке знаний</p>
  </div>
  <div class="sec-grid">
    <div class="scard" data-sec="fire2026" onclick="selSec(this)">
      <div class="ic">🔫</div>
      <div class="inf"><h3>Огневая подготовка</h3><p>5 билетов × 20 вопросов</p></div>
      <div class="cnt">100</div>
    </div>
    <div class="scard" data-sec="service2026" onclick="selSec(this)">
      <div class="ic">📋</div>
      <div class="inf"><h3>Служебная подготовка</h3><p>5 билетов × 20 вопросов</p></div>
      <div class="cnt">100</div>
    </div>
    <div class="scard" data-sec="mpp2026" onclick="selSec(this)">
      <div class="ic">🧠</div>
      <div class="inf"><h3>МПП</h3><p>3 билета × 20 вопросов</p></div>
      <div class="cnt">60</div>
    </div>
  </div>
  <div class="trow" id="trow" style="display:none"></div>
  <div class="srow">
    <label for="shf">Перемешать вопросы</label>
    <label class="tog"><input type="checkbox" id="shf"><span class="tog-sl"></span></label>
  </div>
  <button class="sbtn" id="sbtn" onclick="startQ()" disabled>Выберите раздел</button>
</div>

<div id="sq" class="scr">
  <div class="qhdr">
    <button class="bbtn" onclick="quitQ()">&#8592;</button>
    <div class="pbar"><div class="pfill" id="pf"></div></div>
    <span class="qcnt" id="qc">1/20</span>
  </div>
  <div class="qcard">
    <div class="qlbl" id="ql">Б1 · Вопрос 1</div>
    <div class="qtxt" id="qt"></div>
    <div class="qimg" id="qi">📸 Вопрос с рисунком — посмотри рисунок в учебнике</div>
  </div>
  <div class="anss" id="ans"></div>
  <div class="hwrap">
    <button class="hbtn" id="hb" onclick="togH()">💡 Подсказка</button>
    <div class="htxt" id="ht"></div>
  </div>
  <button class="nbtn" id="nb" onclick="nextQ()">Далее →</button>
</div>

<div id="sr" class="scr">
  <div class="rtop">
    <div class="scircle" id="sc">
      <span class="snum" id="sn">0</span>
      <span class="sof" id="so">/0</span>
    </div>
    <div class="slbl" id="sl"></div>
    <div class="spct" id="sp"></div>
  </div>
  <div class="mtitle" id="mt" style="display:none">Ошибки</div>
  <div id="mc"></div>
  <div class="ract">
    <button onclick="retryQ()">↺ Повторить</button>
    <button class="pb" onclick="goHome()">На главную</button>
  </div>
</div>

</div>

let sec=null,tick=0,qs=[],cur=0,score=0,errs=[],done=false;

function show(id){document.querySelectorAll('.scr').forEach(s=>s.classList.remove('on'));document.getElementById(id).classList.add('on')}

function selSec(el){
  document.querySelectorAll('.scard').forEach(c=>c.classList.remove('on'));
  el.classList.add('on');sec=el.dataset.sec;tick=0;
  buildTick();
  const sb=document.getElementById('sbtn');sb.disabled=false;sb.textContent='Начать →';
}

function buildTick(){
  const r=document.getElementById('trow');r.innerHTML='';r.style.display='flex';
  const ab=mk('button','tbtn on','Все',()=>selT(0,ab));r.appendChild(ab);
  DATA[sec].forEach((_,i)=>{const b=mk('button','tbtn','Б'+(i+1),()=>selT(i+1,b));r.appendChild(b)});
}

function selT(t,btn){tick=t;document.querySelectorAll('.tbtn').forEach(b=>b.classList.remove('on'));btn.classList.add('on')}

function mk(tag,cls,txt,fn){const e=document.createElement(tag);e.className=cls;if(txt)e.textContent=txt;if(fn)e.onclick=fn;return e}

function startQ(){
  if(!sec)return;
  qs=[];
  DATA[sec].forEach((t,ti)=>{
    if(tick&&tick!==ti+1)return;
    t.questions.forEach((q,qi)=>qs.push({...q,ti,tid:t.id,qi}));
  });
  if(document.getElementById('shf').checked){
    for(let i=qs.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[qs[i],qs[j]]=[qs[j],qs[i]];}
  }
  cur=0;score=0;errs=[];done=false;show('sq');renderQ();
}

function renderQ(){
  const q=qs[cur],n=qs.length;
  document.getElementById('pf').style.width=(cur/n*100)+'%';
  document.getElementById('qc').textContent=(cur+1)+'/'+n;
  document.getElementById('ql').textContent='Б'+q.tid+' · Вопрос '+(q.qi+1);
  document.getElementById('qt').textContent=q.text;
  const qi=document.getElementById('qi');qi.style.display=q.image?'':'none';
  const ac=document.getElementById('ans');ac.innerHTML='';
  q.options.forEach((o,i)=>{
    const b=mk('button','abtn',o,()=>ansQ(i,b));
    ac.appendChild(b);
  });
  const tip=getTip(q.ti,q.qi);
  const hb=document.getElementById('hb');hb.style.display=tip?'':'none';
  const ht=document.getElementById('ht');ht.style.display='none';ht.textContent=tip||'';
  document.getElementById('nb').style.display='none';done=false;
}

function getTip(ti,qi){
  if(!TIPS[sec])return null;
  const t=TIPS[sec][ti];return t?t[qi]||null:null;
}

function togH(){const ht=document.getElementById('ht');ht.style.display=ht.style.display==='none'?'':'none'}

function ansQ(i,btn){
  if(done)return;done=true;
  const q=qs[cur];
  document.querySelectorAll('.abtn').forEach(b=>b.disabled=true);
  document.querySelectorAll('.abtn')[q.correctIndex].classList.add('ok');
  if(i===q.correctIndex){score++;}
  else{btn.classList.add('er');errs.push({q:q.text,yr:q.options[i],cr:q.options[q.correctIndex]});}
  document.getElementById('pf').style.width=((cur+1)/qs.length*100)+'%';
  const nb=document.getElementById('nb');nb.style.display='';nb.className='nbtn go';
  nb.textContent=cur<qs.length-1?'Следующий →':'Результат →';
}

function nextQ(){cur++;if(cur>=qs.length)showR();else renderQ()}

function showR(){
  show('sr');const n=qs.length,p=Math.round(score/n*100);
  document.getElementById('sn').textContent=score;
  document.getElementById('so').textContent='/'+n;
  const sc=document.getElementById('sc');sc.className='scircle';
  let lbl;
  if(p>=85)lbl='✅ Отлично!';
  else if(p>=70){lbl='👍 Хорошо';sc.classList.add('wn');}
  else{lbl='📚 Нужно повторить';sc.classList.add('er');}
  document.getElementById('sl').textContent=lbl;
  document.getElementById('sp').textContent=p+'% правильных ответов';
  const mt=document.getElementById('mt'),mc=document.getElementById('mc');
  if(errs.length){
    mt.style.display='';
    mc.innerHTML=errs.map(e=>`<div class="mitem"><div class="mq">${e.q}</div><div class="myr">✗ ${e.yr}</div><div class="mcr">✓ ${e.cr}</div></div>`).join('');
  }else{mt.style.display='none';mc.innerHTML='';}
}

function retryQ(){startQ()}
function goHome(){show('sh')}
function quitQ(){show('sh')}
</script>

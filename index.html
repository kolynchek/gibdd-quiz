<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0D1117">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#0D1117;--s1:#161B22;--s2:#21262D;--bd:#30363D;--pr:#58A6FF;--ok:#3FB950;--er:#F85149;--wn:#E3B341;--tx:#E6EDF3;--mu:#8B949E;--r:12px}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;overflow:hidden}
#app{height:100%;max-width:480px;margin:0 auto;position:relative}
.scr{position:absolute;inset:0;display:none;flex-direction:column;overflow-y:auto;padding:16px;padding-top:max(16px,env(safe-area-inset-top));padding-bottom:calc(max(24px,env(safe-area-inset-bottom)) + 16px)}
.scr.on{display:flex}
/* home */
.htitle{text-align:center;padding:20px 0 20px}
.htitle h1{font-size:24px;font-weight:800;letter-spacing:-.5px}
.htitle p{color:var(--mu);font-size:13px;margin-top:5px}
.sec-grid{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.scard{background:var(--s1);border:2px solid var(--bd);border-radius:var(--r);padding:16px;cursor:pointer;display:flex;align-items:center;gap:12px;transition:.15s;user-select:none}
.scard.on{border-color:var(--pr);background:rgba(88,166,255,.08)}
.scard .ic{font-size:30px;flex-shrink:0}
.scard .inf h3{font-size:15px;font-weight:600}
.scard .inf p{font-size:12px;color:var(--mu);margin-top:2px}
.scard .cnt{margin-left:auto;background:var(--s2);border-radius:6px;padding:3px 9px;font-size:11px;color:var(--mu);flex-shrink:0}
.trow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tbtn{padding:9px 15px;border-radius:8px;border:1.5px solid var(--bd);background:var(--s1);color:var(--tx);cursor:pointer;font-size:13px;font-weight:500;user-select:none}
.tbtn.on{border-color:var(--pr);background:rgba(88,166,255,.1);color:var(--pr)}
.srow{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-top:1px solid var(--bd)}
.srow label{font-size:14px;color:var(--mu);cursor:pointer}
.tog{position:relative;width:46px;height:26px;flex-shrink:0}
.tog input{opacity:0;width:0;height:0;position:absolute}
.tog-sl{position:absolute;inset:0;background:var(--bd);border-radius:13px;cursor:pointer;transition:.2s}
.tog input:checked+.tog-sl{background:var(--pr)}
.tog-sl:before{content:'';position:absolute;width:20px;height:20px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.tog input:checked+.tog-sl:before{transform:translateX(20px)}
.sbtn{background:var(--pr);color:#0D1117;border:none;border-radius:var(--r);padding:16px;font-size:16px;font-weight:700;cursor:pointer;margin-top:auto;width:100%}
.sbtn:disabled{background:var(--bd);color:var(--mu);cursor:default}
.sbtn:not(:disabled):active{opacity:.85}
/* quiz screen - split layout */
#sq{padding:0;overflow:hidden}
.qhdr{display:flex;align-items:center;gap:8px;padding:calc(max(16px,env(safe-area-inset-top)) + 10px) 16px 10px;flex-shrink:0;background:var(--bg)}
.bbtn{background:none;border:none;color:var(--mu);font-size:22px;cursor:pointer;padding:4px 6px;line-height:1}
.pbar{flex:1;height:5px;background:var(--bd);border-radius:3px;overflow:hidden}
.pfill{height:100%;background:var(--pr);border-radius:3px;transition:width .4s}
.qcnt{font-size:12px;color:var(--mu);white-space:nowrap}
.tmr{font-size:13px;font-weight:700;color:var(--ok);white-space:nowrap;min-width:44px;text-align:right}
.tmr.warn{color:var(--wn)}.tmr.urg{color:var(--er)}
/* scrollable body */
.qbody{flex:1;overflow-y:auto;padding:0 16px 12px}
.qcard{background:var(--s1);border-radius:var(--r);padding:16px;margin-bottom:12px}
.qlbl{font-size:11px;color:var(--mu);text-transform:uppercase;letter-spacing:.5px;margin-bottom:7px}
.qtxt{font-size:15px;line-height:1.65;font-weight:500}
.qimg{margin-top:10px;border-radius:8px;overflow:hidden;display:none}
.anss{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.abtn{background:var(--s1);border:1.5px solid var(--bd);border-radius:var(--r);padding:13px 15px;text-align:left;color:var(--tx);font-size:14px;line-height:1.5;cursor:pointer;transition:.12s;min-height:50px;width:100%;font-family:inherit}
.abtn:not(:disabled):active{background:var(--s2)}
.abtn.ok{border-color:var(--ok)!important;background:rgba(63,185,80,.12)!important;color:var(--ok)!important}
.abtn.er{border-color:var(--er)!important;background:rgba(248,81,73,.12)!important;color:var(--er)!important}
.abtn.hint{border-color:var(--pr)!important;background:rgba(88,166,255,.12)!important;color:var(--pr)!important}
.hwrap{margin-bottom:12px}
.hbtn{background:none;border:1.5px solid var(--bd);border-radius:var(--r);padding:11px 16px;color:var(--mu);font-size:13px;cursor:pointer;width:100%;font-family:inherit}
.htxt{margin-top:8px;padding:11px 13px;background:rgba(88,166,255,.1);border-left:3px solid var(--pr);border-radius:4px;font-size:13px;color:var(--pr);line-height:1.6;display:none}
/* fixed footer */
.qfoot{flex-shrink:0;background:var(--bg);border-top:1px solid var(--bd);padding:10px 16px calc(max(20px,env(safe-area-inset-bottom)) + 10px)}
/* question nav grid */
.qnav{display:grid;gap:5px;margin-bottom:10px}
.qnbtn{border:1.5px solid var(--bd);border-radius:7px;background:var(--s1);color:var(--mu);font-size:12px;font-weight:600;cursor:pointer;padding:6px 2px;text-align:center;transition:.1s;font-family:inherit}
.qnbtn.cur{border-color:var(--pr);color:var(--pr)}
.qnbtn.ok{border-color:var(--ok);background:rgba(63,185,80,.18);color:var(--ok)}
.qnbtn.er{border-color:var(--er);background:rgba(248,81,73,.18);color:var(--er)}
.qnbtn.ok.cur{box-shadow:0 0 0 2px var(--ok)}
.qnbtn.er.cur{box-shadow:0 0 0 2px var(--er)}
.qnbtn.cur:not(.ok):not(.er){box-shadow:0 0 0 2px var(--pr)}
/* timer expired banner */
.tbanner{background:rgba(248,81,73,.15);border:1.5px solid var(--er);border-radius:10px;padding:10px 14px;margin-bottom:10px;font-size:13px;color:var(--er);text-align:center;display:none}
/* result */
.rtop{display:flex;flex-direction:column;align-items:center;padding:28px 0 20px;flex-shrink:0}
.scircle{width:120px;height:120px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;border:4px solid var(--ok);margin-bottom:14px}
.scircle.wn{border-color:var(--wn)}.scircle.er{border-color:var(--er)}
.snum{font-size:34px;font-weight:800;line-height:1}
.sof{font-size:13px;color:var(--mu)}
.slbl{font-size:18px;font-weight:600}
.spct{font-size:13px;color:var(--mu);margin-top:4px}
.mtitle{font-size:12px;font-weight:600;color:var(--mu);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;flex-shrink:0}
.mitem{background:var(--s1);border-radius:10px;padding:12px 14px;margin-bottom:8px}
.mq{font-size:12px;color:var(--mu);margin-bottom:4px}
.myr{font-size:13px;color:var(--er)}
.mcr{font-size:13px;color:var(--ok);font-weight:500;margin-top:2px}
.ract{display:flex;gap:10px;margin-top:16px;flex-shrink:0}
.ract button{flex:1;padding:14px;border-radius:var(--r);font-size:14px;font-weight:600;cursor:pointer;border:1.5px solid var(--bd);background:var(--s1);color:var(--tx);font-family:inherit}
.ract .pb{background:var(--pr);border-color:var(--pr);color:#0D1117}
</style>
</head>
<body>
<div id="app">

<div id="sh" class="scr on">
  <div class="htitle">
    <h1>🚔 ГИБДД 2026</h1>
    <p>Тренажёр для подготовки к проверке знаний</p>
  </div>
  <div class="sec-grid">

      <div class="cnt">100</div>
    </div>
    <div class="scard" data-sec="mpp2026" onclick="selSec(this)">
      <div class="ic">🧠</div>
      <div class="inf"><h3>МПП</h3><p>3 билета × 20 вопросов</p></div>
      <div class="cnt">60</div>
    </div>
  </div>
  <div class="trow" id="trow" style="display:none"></div>
  <div class="srow">
    <label for="shf">Перемешать вопросы</label>
    <label class="tog"><input type="checkbox" id="shf"><span class="tog-sl"></span></label>
  </div>
  <button class="sbtn" id="sbtn" onclick="startQ()" disabled>Выберите раздел</button>
</div>

<div id="sq" class="scr">
  <div class="qhdr">
    <button class="bbtn" onclick="quitQ()">&#8592;</button>
    <div class="pbar"><div class="pfill" id="pf"></div></div>
    <span class="qcnt" id="qc">1/20</span>
    <span class="tmr" id="tmr">20:00</span>
  </div>
  <div class="qbody" id="qbody">
    <div class="qcard">
      <div class="qlbl" id="ql">Б1 · Вопрос 1</div>
      <div class="qtxt" id="qt"></div>
      <div class="qimg" id="qi"></div>
    </div>
    <div class="anss" id="ans"></div>
    <div class="hwrap">
      <button class="hbtn" id="hb" onclick="togH()">💡 Подсказка</button>
      <div class="htxt" id="ht"></div>
    </div>
  </div>
  <div class="qfoot">
    <div class="tbanner" id="tbanner">⏰ Время вышло — тест не сдан, но можно дорешать</div>
    <div class="qnav" id="qnav"></div>
  </div>
</div>

<div id="sr" class="scr">
  <div class="rtop">
    <div class="scircle" id="sc">
      <span class="snum" id="sn">0</span>
      <span class="sof" id="so">/0</span>
    </div>
    <div class="slbl" id="sl"></div>
    <div class="spct" id="sp"></div>
  </div>
  <div class="mtitle" id="mt" style="display:none">Ошибки</div>
  <div id="mc"></div>
  <div class="ract">
    <button onclick="retryQ()">↺ Повторить</button>
    <button class="pb" onclick="goHome()">На главную</button>
  </div>
  <button class="sbtn" id="rwbtn" onclick="retryWrong()" style="margin-top:10px;display:none">🔁 Повторить ошибки</button>
</div>

</div>

let sec=null,tick=0,qs=[],cur=0,score=0,errs=[],wrongQs=[],done=false,answers=[],autoTimer=null,countdown=null,timeLeft=0,timedOut=false;

function show(id){document.querySelectorAll('.scr').forEach(s=>s.classList.remove('on'));document.getElementById(id).classList.add('on')}

function selSec(el){
  document.querySelectorAll('.scard').forEach(c=>c.classList.remove('on'));
  el.classList.add('on');sec=el.dataset.sec;tick=0;
  buildTick();
  const sb=document.getElementById('sbtn');sb.disabled=false;sb.textContent='Начать →';
}

function buildTick(){
  const r=document.getElementById('trow');r.innerHTML='';r.style.display='flex';
  const ab=mk('button','tbtn on','Все',()=>selT(0,ab));r.appendChild(ab);
  DATA[sec].forEach((_,i)=>{const b=mk('button','tbtn','Б'+(i+1),()=>selT(i+1,b));r.appendChild(b)});
}

function selT(t,btn){tick=t;document.querySelectorAll('.tbtn').forEach(b=>b.classList.remove('on'));btn.classList.add('on')}

function mk(tag,cls,txt,fn){const e=document.createElement(tag);e.className=cls;if(txt)e.textContent=txt;if(fn)e.onclick=fn;return e}

function startQ(){
  if(!sec)return;
  qs=[];
  DATA[sec].forEach((t,ti)=>{
    if(tick&&tick!==ti+1)return;
    t.questions.forEach((q,qi)=>qs.push({...q,ti,tid:t.id,qi}));
  });
  if(document.getElementById('shf').checked){
    for(let i=qs.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[qs[i],qs[j]]=[qs[j],qs[i]];}
  }
  cur=0;score=0;errs=[];wrongQs=[];done=false;timedOut=false;
  answers=new Array(qs.length).fill(-1);
  document.getElementById('tbanner').style.display='none';
  buildQNav();
  startTimer();
  show('sq');
  renderQ();
}

/* ---- timer ---- */
function startTimer(){
  clearInterval(countdown);
  timeLeft=20*60;
  updateTimerDisplay();
  countdown=setInterval(()=>{
    timeLeft--;
    updateTimerDisplay();
    if(timeLeft<=0){
      clearInterval(countdown);
      timedOut=true;
      document.getElementById('tbanner').style.display='block';
    }
  },1000);
}

function updateTimerDisplay(){
  const m=Math.floor(timeLeft/60),s=timeLeft%60;
  const el=document.getElementById('tmr');
  el.textContent=(m<10?'0':'')+m+':'+(s<10?'0':'')+s;
  el.className='tmr'+(timeLeft<=60?' urg':timeLeft<=180?' warn':'');
}

function stopTimer(){clearInterval(countdown);}

/* ---- question nav grid ---- */
function buildQNav(){
  const nav=document.getElementById('qnav');
  nav.innerHTML='';
  const cols=Math.min(qs.length,10);
  nav.style.gridTemplateColumns='repeat('+cols+',1fr)';
  qs.forEach((_,i)=>{
    const b=mk('button','qnbtn',(i+1),()=>goQ(i));
    b.id='qn'+i;
    nav.appendChild(b);
  });
}

function updateQNav(){
  qs.forEach((_,i)=>{
    const b=document.getElementById('qn'+i);
    if(!b)return;
    b.className='qnbtn'+(i===cur?' cur':'')+(answers[i]===-1?'':answers[i]===qs[i].correctIndex?' ok':' er');
  });
}

function goQ(i){
  clearTimeout(autoTimer);
  cur=i;
  renderQ();
  document.getElementById('qbody').scrollTop=0;
}

/* ---- render ---- */
function renderQ(){
  const q=qs[cur],n=qs.length,ans=answers[cur];
  document.getElementById('pf').style.width=((answers.filter(a=>a!==-1).length)/n*100)+'%';
  document.getElementById('qc').textContent=(cur+1)+'/'+n;
  document.getElementById('ql').textContent='Б'+q.tid+' · Вопрос '+(q.qi+1);
  document.getElementById('qt').textContent=q.text;
  const qi=document.getElementById('qi');
  if(q.image){qi.style.display='block';qi.innerHTML='<img src="https://raw.githubusercontent.com/VladimirKidanov/gibdd-2026/main/'+q.image+'" style="max-width:100%;border-radius:8px;display:block" alt="">';}
  else{qi.style.display='none';qi.innerHTML='';}
  const ac=document.getElementById('ans');ac.innerHTML='';
  q.options.forEach((o,i)=>{
    const b=mk('button','abtn',o,ans===-1?()=>ansQ(i,b):null);
    if(ans!==-1){b.disabled=true;if(i===q.correctIndex)b.classList.add('ok');else if(i===ans)b.classList.add('er');}
    ac.appendChild(b);
  });
  const tip=getTip(q.ti,q.qi);
  const hb=document.getElementById('hb');hb.style.display=tip?'block':'none';
  const ht=document.getElementById('ht');ht.style.display='none';ht.textContent=tip||'';
  done=ans!==-1;
  updateQNav();
}

function getTip(ti,qi){
  if(!TIPS[sec])return null;
  const t=TIPS[sec][ti];return t?t[qi]||null:null;
}

function togH(){
  const ht=document.getElementById('ht');
  const opening=ht.style.display!=='block';
  ht.style.display=opening?'block':'none';
  if(opening&&!done){
    const btns=document.querySelectorAll('.abtn');
    if(btns[qs[cur].correctIndex])btns[qs[cur].correctIndex].classList.add('hint');
  }
}

function ansQ(i,btn){
  if(done)return;done=true;answers[cur]=i;
  const q=qs[cur];
  document.querySelectorAll('.abtn').forEach(b=>{b.disabled=true;b.classList.remove('hint');});
  document.querySelectorAll('.abtn')[q.correctIndex].classList.add('ok');
  if(i===q.correctIndex){score++;}
  else{btn.classList.add('er');errs.push({q:q.text,yr:q.options[i],cr:q.options[q.correctIndex]});wrongQs.push(q);}
  updateQNav();
  // auto-advance only if not timed out
  autoTimer=setTimeout(()=>{
    if(done){
      const next=answers.indexOf(-1);
      if(next!==-1){goQ(next);}
      else{stopTimer();showR();}
    }
  },1200);
}

function showR(){
  stopTimer();
  show('sr');
  const n=qs.length,p=Math.round(score/n*100);
  document.getElementById('sn').textContent=score;
  document.getElementById('so').textContent='/'+n;
  const sc=document.getElementById('sc');sc.className='scircle';
  let lbl;
  if(timedOut)lbl='⏰ Время истекло';
  else if(p>=85)lbl='✅ Отлично!';
  else if(p>=70){lbl='👍 Хорошо';sc.classList.add('wn');}
  else{lbl='📚 Нужно повторить';sc.classList.add('er');}
  if(timedOut)sc.classList.add('er');
  document.getElementById('sl').textContent=lbl;
  document.getElementById('sp').textContent=p+'% правильных ответов';
  const mt=document.getElementById('mt'),mc=document.getElementById('mc'),rw=document.getElementById('rwbtn');
  if(errs.length){
    mt.style.display='';
    mc.innerHTML=errs.map(e=>`<div class="mitem"><div class="mq">${e.q}</div><div class="myr">✗ ${e.yr}</div><div class="mcr">✓ ${e.cr}</div></div>`).join('');
    rw.style.display='';
  }else{mt.style.display='none';mc.innerHTML='';rw.style.display='none';}
}

function retryQ(){clearTimeout(autoTimer);stopTimer();startQ()}
function retryWrong(){clearTimeout(autoTimer);stopTimer();qs=[...wrongQs];cur=0;score=0;errs=[];wrongQs=[];done=false;timedOut=false;answers=new Array(qs.length).fill(-1);document.getElementById('tbanner').style.display='none';buildQNav();startTimer();show('sq');renderQ();}
function goHome(){clearTimeout(autoTimer);stopTimer();show('sh')}
function quitQ(){clearTimeout(autoTimer);stopTimer();show('sh')}
</script>
</body>
</html>
